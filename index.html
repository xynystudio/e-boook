<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Book Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* 1. LOADING SCREEN */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
      padding: 10px 20px;
    }

    .loading-logo {
      height: 55px;
      width: auto;
      object-fit: contain;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #0284c7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #475569;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* 2. TATA LETAK UTAMA */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* SIDEBAR NAVIGATION */
    .sidebar {
      width: 280px;
      background: #1e293b;
      color: #f8fafc;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
      z-index: 10;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .menu-section {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      margin: 15px 0 8px 5px;
      letter-spacing: 0.5px;
    }

    .sidebar nav ul {
      list-style: none;
    }

    .sidebar nav li {
      margin-bottom: 6px;
    }

    .sidebar nav a {
      color: #94a3b8;
      text-decoration: none;
      display: block;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sidebar nav a:hover, 
    .sidebar nav a.active {
      background: #0284c7;
      color: #ffffff;
    }

    /* AREA KONTEN (PEMBACA) */
    .content-area {
      flex: 1;
      height: 100%;
      background: #334155;
      position: relative;
    }

    /* Tampilan Halaman Gambar (Cover, Pengesahan, dll) */
    .image-viewer {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      background: #0f172a;
    }

    .image-viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 4px;
    }

    /* Bingkai Halaman HTML / Bab */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- LOADING SCREEN DENGAN LOGO INSTANSI -->
  <div id="loading-screen">
    <div class="logo-container">
      <img src="https://bpsdm.sumutprov.go.id/v1/wp-content/uploads/2021/08/logo-bpsdm-sumut.png" alt="BPSDM SUMUT" class="loading-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/29/Lambang_Kabupaten_Deli_Serdang.png" alt="Pemkab Deli Serdang" class="loading-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Logo_Lembaga_Administrasi_Negara.png" alt="LAN RI" class="loading-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Logo_BerAKHLAK.svg/1200px-Logo_BerAKHLAK.svg.png" alt="BerAKHLAK" class="loading-logo">
      <img src="https://bpsdm.sumutprov.go.id/v1/wp-content/uploads/2022/01/SUMUT-CORPU.png" alt="SUMUT CORPU" class="loading-logo">
    </div>

    <div class="spinner"></div>
    <p class="loading-text">Memuat E-Book...</p>
  </div>

  <!-- CONTAINER UTAMA E-BOOK -->
  <div class="app-container">
    
    <!-- SIDEBAR / DAFTAR ISI -->
    <aside class="sidebar">
      <div class="sidebar-title">E-Book Reader</div>
      <nav>
        <div class="menu-section">Halaman Depan</div>
        <ul>
          <li><a onclick="showImage('cover.jpg', this)" class="active">1. Cover Depan</a></li>
          <li><a onclick="showImage('pengesahan.jpg', this)">2. Lembar Pengesahan</a></li>
          <li><a onclick="showImage('gambar3.jpg', this)">3. Halaman Depan 3</a></li>
          <li><a onclick="showImage('gambar4.jpg', this)">4. Halaman Depan 4</a></li>
        </ul>

        <div class="menu-section">Daftar Bab</div>
        <ul>
          <!-- Link ke file HTML bab berikutnya -->
          <li><a onclick="showHtml('bab1.html', this)">Bab 1</a></li>
          <li><a onclick="showHtml('bab2.html', this)">Bab 2</a></li>
          <li><a onclick="showHtml('bab3.html', this)">Bab 3</a></li>
        </ul>
      </nav>
    </aside>

    <!-- AREA TAMPILAN KONTEN -->
    <main class="content-area">
      <!-- Container untuk menampilkan Gambar (Cover, Pengesahan, dll) -->
      <div id="image-viewer" class="image-viewer">
        <!-- Default menampilkan Cover Depan -->
        <img id="main-image" src="cover.jpg" alt="Halaman Gambar">
      </div>

      <!-- Frame untuk menampilkan file HTML (Bab) -->
      <iframe id="book-frame" name="book-frame"></iframe>
    </main>

  </div>

  <!-- JAVASCRIPT UTAMA -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loadingScreen = document.getElementById("loading-screen");

      // Hilangkan loading screen setelah 1.2 detik
      setTimeout(() => {
        loadingScreen.style.opacity = "0";
        setTimeout(() => {
          loadingScreen.style.visibility = "hidden";
        }, 600);
      }, 1200);
    });

    // Fungsi untuk menampilkan Halaman Gambar (Cover, Pengesahan, dsb)
    function showImage(imagePath, element) {
      setActiveMenu(element);
      document.getElementById('book-frame').style.display = 'none';
      
      const imageViewer = document.getElementById('image-viewer');
      const mainImage = document.getElementById('main-image');
      
      mainImage.src = imagePath;
      imageViewer.style.display = 'flex';
    }

    // Fungsi untuk menampilkan File HTML (Bab 1, Bab 2, dsb)
    function showHtml(htmlPath, element) {
      setActiveMenu(element);
      document.getElementById('image-viewer').style.display = 'none';
      
      const iframe = document.getElementById('book-frame');
      iframe.src = htmlPath;
      iframe.style.display = 'block';
    }

    // Fungsi mengatur highlight warna tombol menu yang aktif
    function setActiveMenu(element) {
      const allLinks = document.querySelectorAll('.sidebar nav a');
      allLinks.forEach(link => link.classList.remove('active'));
      element.classList.add('active');
    }
  </script>

</body>
</html>
