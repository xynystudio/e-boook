<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070809">
<meta name="description" content="Digital A4 Editorial">
<title>THE ARCHIVE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#070809;
--panel:#101216;
--panel2:#15171c;
--white:#f6f4ee;
--muted:#858991;
--line:rgba(255,255,255,.11);
--ease:cubic-bezier(.2,.75,.25,1);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
min-height:100%;
background:var(--bg);
}

body{
font-family:
Inter,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
color:var(--white);
overflow-x:hidden;
}

button,input{
font:inherit;
}

button{
cursor:pointer;
}

img{
display:block;
max-width:100%;
}

/* =========================================================
LOADER
========================================================= */

#loader{
position:fixed;
inset:0;
z-index:99999;
display:grid;
place-items:center;
background:#070809;
transition:
opacity .55s ease,
visibility .55s ease;
}

#loader.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
}

.loader-box{
text-align:center;
}

.loader-ring{
width:54px;
height:54px;
border:1px solid rgba(255,255,255,.12);
border-top-color:white;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
}

.loader-label{
margin-top:20px;
font-size:9px;
letter-spacing:.35em;
text-transform:uppercase;
color:#777b83;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* =========================================================
HEADER
========================================================= */

.header{
position:fixed;
top:0;
left:0;
right:0;
height:78px;
z-index:1000;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 clamp(16px,4vw,52px);
pointer-events:none;
}

.header:before{
content:"";
position:absolute;
inset:0;
z-index:-1;
background:
linear-gradient(
to bottom,
rgba(7,8,9,.97),
rgba(7,8,9,.75),
transparent
);
backdrop-filter:blur(14px);
}

.header>*{
pointer-events:auto;
}

.brand{
display:flex;
align-items:center;
gap:14px;
}

.logo{
width:29px;
height:29px;
border:1px solid rgba(255,255,255,.3);
transform:rotate(45deg);
display:grid;
place-items:center;
}

.logo span{
transform:rotate(-45deg);
font-size:8px;
}

.brand-text{
font-size:10px;
font-weight:700;
letter-spacing:.35em;
}

.header-actions{
display:flex;
gap:7px;
}

.icon{
width:42px;
height:42px;
border:1px solid var(--line);
border-radius:50%;
background:rgba(255,255,255,.045);
color:white;
display:grid;
place-items:center;
font-size:16px;
transition:.25s;
}

.icon:hover{
background:rgba(255,255,255,.12);
transform:translateY(-2px);
}

/* =========================================================
READER
========================================================= */

.reader{
width:100%;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:
105px 12px
100px;
}

.book{
position:relative;
width:min(92vw,calc(78vh * .70710678));
aspect-ratio:.70710678;
perspective:2400px;
}

.book:before{
content:"";
position:absolute;
inset:3% -4% -4% 2%;
background:#000;
filter:blur(22px);
opacity:.7;
z-index:-2;
}

.page{
position:absolute;
inset:0;
background:#fff;
overflow:hidden;
opacity:0;
transform:
translateX(45px)
scale(.985);
transition:
opacity .45s var(--ease),
transform .65s var(--ease);
pointer-events:none;
}

.page.active{
opacity:1;
transform:translateX(0) scale(1);
pointer-events:auto;
}

.page img{
width:100%;
height:100%;
object-fit:contain;
background:white;
user-select:none;
-webkit-user-drag:none;
}

.empty{
position:absolute;
inset:0;
display:none;
place-items:center;
text-align:center;
border:1px solid var(--line);
background:
radial-gradient(
circle at 50% 30%,
#191c22,
#090a0d
);
}

.empty.show{
display:grid;
}

.empty-title{
font-size:12px;
font-weight:700;
letter-spacing:.2em;
text-transform:uppercase;
}

.empty-text{
margin-top:10px;
font-size:10px;
color:var(--muted);
}

/* =========================================================
BOTTOM BAR
========================================================= */

.nav{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
z-index:2000;
display:flex;
align-items:center;
gap:6px;
padding:8px;
border:1px solid var(--line);
background:rgba(9,10,13,.82);
backdrop-filter:blur(24px);
border-radius:999px;
box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.nav-btn{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:rgba(255,255,255,.05);
color:white;
font-size:22px;
display:grid;
place-items:center;
}

.nav-btn:disabled{
opacity:.2;
cursor:default;
}

.counter{
min-width:76px;
text-align:center;
font-size:9px;
letter-spacing:.15em;
color:#aaaeb6;
}

.progress{
position:fixed;
left:0;
right:0;
bottom:0;
height:2px;
background:rgba(255,255,255,.05);
z-index:3000;
}

.progress-bar{
height:100%;
width:0;
background:white;
transition:width .5s var(--ease);
}

/* =========================================================
THUMBNAILS
========================================================= */

.thumbs{
position:fixed;
left:50%;
bottom:82px;
transform:translateX(-50%);
width:min(94vw,1050px);
max-height:0;
overflow:hidden;
opacity:0;
pointer-events:none;
z-index:1800;
border-radius:18px;
background:rgba(10,11,14,.94);
border:1px solid transparent;
backdrop-filter:blur(25px);
transition:
max-height .4s var(--ease),
opacity .3s;
}

.thumbs.open{
max-height:230px;
opacity:1;
pointer-events:auto;
border-color:var(--line);
}

.thumb-list{
display:flex;
gap:10px;
overflow-x:auto;
padding:15px;
}

.thumb{
flex:0 0 75px;
aspect-ratio:.707;
border:2px solid transparent;
border-radius:5px;
overflow:hidden;
background:white;
opacity:.5;
}

.thumb.active{
border-color:white;
opacity:1;
}

.thumb img{
width:100%;
height:100%;
object-fit:cover;
}

/* =========================================================
OVERLAY
========================================================= */

.overlay{
position:fixed;
inset:0;
z-index:5000;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
background:rgba(0,0,0,.78);
backdrop-filter:blur(20px);
opacity:0;
visibility:hidden;
transition:.3s;
}

.overlay.open{
opacity:1;
visibility:visible;
}

/* =========================================================
LOGIN
========================================================= */

.login{
width:min(410px,100%);
padding:32px;
border:1px solid var(--line);
border-radius:23px;
background:#111318;
box-shadow:0 50px 150px rgba(0,0,0,.75);
}

.login h2{
font-size:17px;
letter-spacing:.13em;
text-transform:uppercase;
}

.login p{
font-size:10px;
color:var(--muted);
margin:8px 0 25px;
}

.field{
margin-bottom:14px;
}

.field label{
display:block;
font-size:9px;
letter-spacing:.15em;
text-transform:uppercase;
color:var(--muted);
margin-bottom:7px;
}

.field input{
width:100%;
height:46px;
padding:0 13px;
border:1px solid var(--line);
border-radius:10px;
outline:none;
background:rgba(255,255,255,.04);
color:white;
}

.field input:focus{
border-color:rgba(255,255,255,.4);
}

.actions{
display:flex;
gap:8px;
margin-top:20px;
}

/* =========================================================
BUTTON
========================================================= */

.btn{
height:43px;
padding:0 16px;
border:1px solid var(--line);
border-radius:10px;
background:rgba(255,255,255,.05);
color:white;
font-size:9px;
font-weight:700;
letter-spacing:.12em;
text-transform:uppercase;
}

.btn:hover{
background:rgba(255,255,255,.12);
}

.btn.primary{
background:white;
color:#08090a;
border-color:white;
}

/* =========================================================
ADMIN
========================================================= */

.admin{
width:min(1100px,100%);
max-height:calc(100vh - 30px);
overflow:auto;
background:#101216;
border:1px solid var(--line);
border-radius:23px;
box-shadow:0 50px 160px rgba(0,0,0,.8);
}

.admin-head{
position:sticky;
top:0;
z-index:10;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 24px;
background:rgba(16,18,22,.94);
backdrop-filter:blur(20px);
border-bottom:1px solid var(--line);
}

.admin-title{
font-size:16px;
font-weight:700;
letter-spacing:.13em;
text-transform:uppercase;
}

.admin-subtitle{
margin-top:6px;
font-size:9px;
color:var(--muted);
}

.green{
color:#7ce0a0;
}

.admin-body{
padding:24px;
}

/* =========================================================
UPLOAD
========================================================= */

.upload{
min-height:190px;
border:1px dashed rgba(255,255,255,.18);
border-radius:18px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:12px;
cursor:pointer;
transition:.25s;
background:rgba(255,255,255,.025);
}

.upload:hover,
.upload.drag{
background:rgba(255,255,255,.07);
border-color:rgba(255,255,255,.5);
}

.plus{
width:58px;
height:58px;
display:grid;
place-items:center;
border-radius:50%;
background:white;
color:#050609;
font-size:29px;
}

.upload strong{
font-size:11px;
letter-spacing:.13em;
}

.upload small{
font-size:9px;
color:var(--muted);
}

#file{
display:none;
}

/* =========================================================
LIST
========================================================= */

.list-head{
display:flex;
justify-content:space-between;
margin:25px 0 12px;
font-size:9px;
letter-spacing:.15em;
text-transform:uppercase;
color:var(--muted);
}

.list{
display:grid;
gap:7px;
}

.row{
display:grid;
grid-template-columns:58px minmax(0,1fr) auto;
align-items:center;
gap:13px;
padding:9px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.06);
border-radius:13px;
}

.row-img{
width:58px;
aspect-ratio:.707;
overflow:hidden;
background:white;
border-radius:6px;
}

.row-img img{
width:100%;
height:100%;
object-fit:cover;
}

.row-title{
font-size:11px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.row-meta{
margin-top:5px;
font-size:8px;
color:var(--muted);
}

.row-buttons{
display:flex;
gap:5px;
}

.small{
width:34px;
height:34px;
display:grid;
place-items:center;
border:1px solid var(--line);
border-radius:8px;
background:rgba(255,255,255,.05);
color:white;
}

.small:hover{
background:rgba(255,255,255,.12);
}

/* =========================================================
ADMIN FOOTER
========================================================= */

.admin-foot{
position:sticky;
bottom:0;
z-index:10;
display:flex;
justify-content:flex-end;
gap:8px;
padding:14px 24px;
border-top:1px solid var(--line);
background:rgba(16,18,22,.95);
backdrop-filter:blur(20px);
}

/* =========================================================
ZOOM
========================================================= */

.zoom{
position:fixed;
inset:0;
z-index:9000;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.96);
padding:20px;
}

.zoom.open{
display:flex;
}

.zoom img{
max-width:96vw;
max-height:92vh;
object-fit:contain;
transition:.25s;
}

.zoom img.big{
transform:scale(2);
}

/* =========================================================
TOAST
========================================================= */

.toast{
position:fixed;
top:88px;
left:50%;
z-index:10000;
transform:translate(-50%,-15px);
padding:12px 18px;
border:1px solid var(--line);
border-radius:999px;
background:#111318;
font-size:9px;
opacity:0;
pointer-events:none;
transition:.3s;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:700px){

.reader{
padding:88px 3px 92px;
}

.book{
width:97vw;
}

.brand-text{
display:none;
}

.admin-body{
padding:14px;
}

.admin-head{
padding:16px;
}

.admin-foot{
padding:12px 14px;
}

.row{
grid-template-columns:50px minmax(0,1fr) auto;
}

.row-img{
width:50px;
}

.row-buttons{
flex-direction:column;
}

.thumbs{
bottom:74px;
}

}

/* =========================================================
LANDSCAPE
========================================================= */

@media(
max-height:560px
) and (
orientation:landscape
){

.reader{
padding:70px 8px;
}

.book{
height:78vh;
width:calc(78vh * .70710678);
}

}

/* =========================================================
REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

*{
animation-duration:.01ms!important;
transition-duration:.01ms!important;
}

}
</style>
</head>

<body>

TOAST

<script>
/* =========================================================
CONFIG
========================================================= */

/*
PASTE DARI SUPABASE:

Project Settings
→ API

Gunakan Project URL dan Publishable Key.

JANGAN masukkan service_role key.
*/

const SUPABASE_URL =
"PASTE_SUPABASE_PROJECT_URL_HERE";

const SUPABASE_KEY =
"PASTE_SUPABASE_PUBLISHABLE_KEY_HERE";


/* =========================================================
SAFE CONFIG CHECK
========================================================= */

const CONFIGURED =
SUPABASE_URL.startsWith("https://") &&
!SUPABASE_URL.includes("PASTE_") &&
SUPABASE_KEY.length > 20 &&
!SUPABASE_KEY.includes("PASTE_");


/* =========================================================
SUPABASE CLIENT
========================================================= */

let supabaseClient = null;

if(
CONFIGURED &&
window.supabase &&
typeof window.supabase.createClient === "function"
){

supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
autoRefreshToken:true,
persistSession:true,
detectSessionInUrl:true
}
}
);

}


/* =========================================================
STATE
========================================================= */

let pages = [];
let adminPages = [];
let current = 0;
let busy = false;


/* =========================================================
HELPER
========================================================= */

const $ = s =>
document.querySelector(s);


/* =========================================================
ELEMENTS
========================================================= */

const loader = $("#loader");
const book = $("#book");
const empty = $("#empty");
const counter = $("#counter");
const prev = $("#prev");
const next = $("#next");
const progress = $("#progress");
const thumbs = $("#thumbs");
const thumbList = $("#thumbList");
const zoom = $("#zoom");
const zoomImage = $("#zoomImage");
const toast = $("#toast");
const loginOverlay = $("#loginOverlay");
const adminOverlay = $("#adminOverlay");
const loginForm = $("#loginForm");
const email = $("#email");
const password = $("#password");
const adminList = $("#adminList");
const pageCount = $("#pageCount");
const file = $("#file");
const upload = $("#upload");


/* =========================================================
TOAST
========================================================= */

let toastTimer;

function showToast(message){

toast.textContent = message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer =
setTimeout(
()=>{
toast.classList.remove("show");
},
2800
);

}


/* =========================================================
PUBLIC DATA
========================================================= */

async function loadPages(){

if(!supabaseClient){

pages = [];

render();

return;

}

try{

const result =
await Promise.race([

supabaseClient
.from("ebook_pages")
.select(
"id,title,image_url,page_order"
)
.eq("published",true)
.order(
"page_order",
{ascending:true}
),

new Promise(
(_,reject)=>
setTimeout(
()=>{
reject(
new Error("timeout")
)
},
8000
)
)

]);

if(result.error){

throw result.error;

}

pages =
result.data || [];

if(current >= pages.length){

current =
Math.max(
0,
pages.length - 1
);

}

render();

}catch(error){

console.error(
"PUBLIC LOAD:",
error
);

pages = [];

render();

showToast(
"Belum tersambung ke database."
);

}

}


/* =========================================================
RENDER
========================================================= */

function render(){

book.innerHTML = "";
thumbList.innerHTML = "";

if(!pages.length){

empty.classList.add("show");

counter.textContent = "0 / 0";

prev.disabled = true;
next.disabled = true;

progress.style.width = "0%";

return;

}

empty.classList.remove("show");

pages.forEach(
(page,index)=>{

const article =
document.createElement("article");

article.className =
"page";

if(index === current){

article.classList.add("active");

}

const image =
document.createElement("img");

image.src =
page.image_url;

image.alt =
page.title ||
`Page ${index + 1}`;

image.loading =
index === current
? "eager"
: "lazy";

image.decoding = "async";

image.draggable = false;

image.addEventListener(
"dblclick",
()=>{
openZoom(
page.image_url
);
}
);

article.appendChild(image);

book.appendChild(article);


/* THUMB */

const thumb =
document.createElement("button");

thumb.className =
"thumb";

if(index === current){

thumb.classList.add("active");

}

const thumbImg =
document.createElement("img");

thumbImg.src =
page.image_url;

thumbImg.alt = "";

thumb.appendChild(thumbImg);

thumb.addEventListener(
"click",
()=>{
go(index);
}
);

thumbList.appendChild(thumb);

}
);

updateNav();

}


/* =========================================================
NAVIGATION
========================================================= */

function updateNav(){

const total =
pages.length;

counter.textContent =
total
? `${current + 1} / ${total}`
: "0 / 0";

prev.disabled =
current <= 0;

next.disabled =
current >= total - 1;

let percent = 0;

if(total === 1){

percent = 100;

}else if(total > 1){

percent =
current /
(total - 1) *
100;

}

progress.style.width =
percent + "%";

[...thumbList.children]
.forEach(
(t,i)=>{
t.classList.toggle(
"active",
i === current
);
}
);

}


/* =========================================================
GO
========================================================= */

function go(target){

if(
busy ||
target < 0 ||
target >= pages.length ||
target === current
){

return;

}

const old =
book.children[current];

const incoming =
book.children[target];

if(!old || !incoming){

return;

}

busy = true;

const forward =
target > current;

incoming.classList.add(
forward
? "enter-right"
: "enter-left"
);

incoming.style.opacity = "0";

requestAnimationFrame(
()=>{

old.classList.remove("active");

incoming.classList.add("active");

incoming.style.opacity = "";

incoming.classList.remove(
forward
? "enter-right"
: "enter-left"
);

}
);

current = target;

setTimeout(
()=>{
busy = false;
updateNav();
},
650
);

}


/* =========================================================
BUTTONS
========================================================= */

prev.onclick =
()=>go(current - 1);

next.onclick =
()=>go(current + 1);


/* =========================================================
KEYBOARD
========================================================= */

document.addEventListener(
"keydown",
e=>{

if(e.key === "ArrowLeft"){

go(current - 1);

}

if(e.key === "ArrowRight"){

go(current + 1);

}

if(e.key === "Escape"){

closeAll();

}

}
);


/* =========================================================
SWIPE
========================================================= */

let sx = null;
let sy = null;

book.addEventListener(
"touchstart",
e=>{

const t =
e.changedTouches[0];

sx = t.clientX;
sy = t.clientY;

},
{passive:true}
);

book.addEventListener(
"touchend",
e=>{

if(sx === null){

return;

}

const t =
e.changedTouches[0];

const dx =
t.clientX - sx;

const dy =
t.clientY - sy;

sx = null;
sy = null;

if(
Math.abs(dx) < 45 ||
Math.abs(dx) < Math.abs(dy)
){

return;

}

if(dx < 0){

go(current + 1);

}else{

go(current - 1);

}

},
{passive:true}
);

========================================================= */

(page,index)=>{

"row-img";

page.title ||

document.createElement("div");

"row-meta";

? "PUBLISHED"
: "DRAFT"
);

document.createElement("div");

"row-buttons";

smallButton(

)
);

);

/* =========================================================
EXTENSION
========================================================= */

function extension(name){

const parts =
name.split(".");

if(parts.length < 2){

return "jpg";

}

return parts.pop()
.toLowerCase()
.replace(/[^a-z0-9]/g,"");

}


/* =========================================================
NEXT ORDER
========================================================= */

async function nextOrder(){

const result =
await supabaseClient
.from("ebook_pages")
.select("page_order")
.order(
"page_order",
{ascending:false}
)
.limit(1);

if(
result.error ||
!result.data ||
!result.data.length
){

return 1;

}

return result.data[0].page_order + 1;

}


/* =========================================================
UPLOAD FILES
========================================================= */

async function uploadFiles(files){

const session =
await getSession();

if(!session){

showToast(
"Login Admin diperlukan."
);

return;

}

const images =
files.filter(
f=>f.type.startsWith("image/")
);

if(!images.length){

showToast(
"Tidak ada gambar valid."
);

return;

}

showToast(
`Mengupload ${images.length} gambar...`
);

let order =
await nextOrder();

let success = 0;

for(const image of images){

let path = null;

try{

const id =
crypto.randomUUID();

path =
`pages/${id}.${extension(image.name)}`;


/* STORAGE */

const uploadResult =
await supabaseClient
.storage
.from("ebook-images")
.upload(
path,
image,
{
cacheControl:"31536000",
contentType:image.type,
upsert:false
}
);

if(uploadResult.error){

throw uploadResult.error;

}


/* URL */

const url =
supabaseClient
.storage
.from("ebook-images")
.getPublicUrl(path)
.data.publicUrl;


/* DATABASE */

const insertResult =
await supabaseClient
.from("ebook_pages")
.insert({
title:image.name,
image_path:path,
image_url:url,
page_order:order,
published:true
});

if(insertResult.error){

await supabaseClient
.storage
.from("ebook-images")
.remove([path]);

throw insertResult.error;

}

order++;
success++;

}catch(error){

console.error(
"UPLOAD ERROR:",
error
);

}

}

await loadAdmin();
await loadPages();

showToast(
success
? `${success} gambar ditambahkan.`
: "Upload gagal."
);

}


/* =========================================================
MOVE PAGE
========================================================= */

async function movePage(
index,
direction
){

const target =
index + direction;

if(
target < 0 ||
target >= adminPages.length
){

return;

}

const a =
adminPages[index];

const b =
adminPages[target];

const temp =
-999999999;

try{

/* A -> TEMP */

let result =
await supabaseClient
.from("ebook_pages")
.update({
page_order:temp
})
.eq("id",a.id);

if(result.error){

throw result.error;

}


/* B -> A */

result =
await supabaseClient
.from("ebook_pages")
.update({
page_order:a.page_order
})
.eq("id",b.id);

if(result.error){

throw result.error;

}


/* TEMP -> B */

result =
await supabaseClient
.from("ebook_pages")
.update({
page_order:b.page_order
})
.eq("id",a.id);

if(result.error){

throw result.error;

}

await loadAdmin();
await loadPages();

}catch(error){

console.error(error);

showToast(
"Gagal mengubah urutan."
);

}

}


/* =========================================================
TOGGLE
========================================================= */

async function togglePage(page){

const result =
await supabaseClient

.update({
published:!page.published
})
.eq("id",page.id);

if(result.error){

console.error(result.error);

showToast(
"Gagal mengubah status."
);

return;

}

await loadAdmin();
await loadPages();

}


/* =========================================================
DELETE
========================================================= */

async function deletePage(page){

if(
!confirm(
`Hapus "${page.title}"?`
)
){

return;

}

const db =
await supabaseClient
.from("ebook_pages")
.delete()
.eq("id",page.id);

if(db.error){

console.error(db.error);

showToast(
"Gagal menghapus halaman."
);

return;

}

if(page.image_path){

const storage =
await supabaseClient
.storage
.from("ebook-images")
.remove([
page.image_path
]);

if(storage.error){

console.error(
storage.error
);

}

}

await loadAdmin();
await loadPages();

showToast(
"Halaman dihapus."
);

}

/* =========================================================
INITIALIZATION
========================================================= */

async function initialize(){

/*
CRITICAL:

Loader tidak lagi bergantung pada Supabase.
*/

try{

/*
Render interface terlebih dahulu.
*/

render();


/*
Jika Supabase belum dipasang,
website tetap berjalan.
*/

if(!CONFIGURED){

console.warn(
"Supabase belum dikonfigurasi."
);

showToast(
"Mode demo: Supabase belum dikonfigurasi."
);

return;

}


/*
Load database dengan timeout.
*/

await Promise.race([

loadPages(),

new Promise(
resolve =>
setTimeout(
resolve,
7000
)
)

];

}catch(error){

console.error(
"INIT ERROR:",
error
);

}finally{

/*
WAJIB:

Loader selalu ditutup.
*/

loader.classList.add("hide");

}

}


/* =========================================================
ABSOLUTE LOADER SAFETY
========================================================= */

setTimeout(
()=>{
loader.classList.add("hide");
},
5000
);


/* =========================================================
START
========================================================= */

initialize();

</script>
